<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qoods Bakery</title>
<script>try{var th=localStorage.getItem('qoods_theme')||'light';document.documentElement.setAttribute('data-theme',th);var lg=localStorage.getItem('qoods_lang')||'sv';document.documentElement.lang=lg;document.documentElement.dir=lg==='ar'?'rtl':'ltr';}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Mulish:wght@400;500;600;700&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html" class="logo"><b>Qoods</b> <span>bageri</span></a>
    <nav class="nav-links">
      <a href="index.html#menu" data-i18n="nav.menu">Meny</a>
      <a href="index.html#about" data-i18n="nav.about">Om oss</a>
      <a href="index.html#reviews" data-i18n="nav.reviews">Omdömen</a>
      <a href="index.html#visit" data-i18n="nav.visit">Hitta hit</a>
      <a href="index.html#contact" data-i18n="nav.contact">Kontakt</a>
    </nav>
    <div class="nav-right">
      <div class="lang-switch">
        <button data-lang="sv" onclick="setLang('sv')">SV</button>
        <button data-lang="en" onclick="setLang('en')">EN</button>
        <button data-lang="ar" onclick="setLang('ar')">ع</button>
      </div>
      <button class="theme-toggle" data-theme-toggle onclick="toggleTheme()" aria-label="Theme">☾</button>
      <a href="cart.html" class="cart-link"><span data-i18n="nav.cart">Kundvagn</span> <span class="cart-badge" data-cart-count>0</span></a>
    </div>
  </div>
</header>

<section class="cartpage">
  <div class="wrap">
    <div class="eyebrow" data-i18n="cart.eyebrow">Kundvagn</div>
    <h1 data-i18n="cart.title">Din kundvagn</h1>
    <div id="cartRoot"></div>
  </div>
</section>

<footer>
  <div class="wrap"><div class="foot-bottom" data-i18n="foot.rights">© 2026 Qoods Bakery. Alla rättigheter förbehållna.</div></div>
</footer>

<script src="i18n.js"></script>
<script src="data.js"></script>
<script>
  const root = document.getElementById("cartRoot");
  const fmt = n => (Math.round(n * 100) / 100).toLocaleString("sv-SE");
  const getQty = id => { const e = getCart().find(x=>x.id===id); const p=productById(id); return e ? e.qty : minQty(p); };
  const priceLabel = p => p.type === "kg" ? `${p.price} ${t('product.per_kg')}` : `${p.price} kr / ${p.weight}`;
  const qtyLabel = (p, q) => p.type === "kg" ? `${fmt(q)} ${t('unit.kg')}` : `× ${q}`;

  function render(){
    const cart = getCart();
    if (!cart.length){
      root.innerHTML = `
        <div class="cart-empty">
          <p>${t('cart.empty')}</p>
          <a class="btn btn-primary" href="index.html#menu">${t('cart.browse')}</a>
        </div>`;
      return;
    }
    const rows = cart.map(item => {
      const p = productById(item.id);
      if (!p) return "";
      return `
        <div class="cart-item">
          <img src="${p.img}" alt="${pName(p.id)}">
          <div>
            <div class="ci-name">${pName(p.id)}</div>
            <div class="ci-price">${priceLabel(p)}</div>
            <div class="ci-controls">
              <div class="mini-stepper">
                <button data-dec="${p.id}">–</button>
                <span>${qtyLabel(p, item.qty)}</span>
                <button data-inc="${p.id}">+</button>
              </div>
              <button class="ci-remove" data-remove="${p.id}">${t('cart.remove')}</button>
            </div>
          </div>
          <div class="ci-total">${fmt(lineTotal(p, item.qty))} kr</div>
        </div>`;
    }).join("");

    const subtotal = cartSubtotal();
    root.innerHTML = `
      <div class="cart-layout">
        <div>${rows}</div>
        <div class="summary">
          <h3>${t('cart.summary')}</h3>
          <div class="sum-row"><span>${t('cart.items')}</span><span>${cart.length}</span></div>
          <div class="sum-row"><span>${t('cart.subtotal')}</span><span>${fmt(subtotal)} kr</span></div>
          <div class="sum-row total"><span>${t('cart.total')}</span><span>${fmt(subtotal)} kr</span></div>
          <button class="btn btn-primary" id="payBtn" style="width:100%">${t('cart.request')}</button>
          <div class="fineprint" id="payNote">${t('cart.fineprint')}</div>
        </div>
      </div>`;

    root.querySelectorAll("[data-inc]").forEach(b => b.onclick = () => { const p=productById(b.dataset.inc); setQty(p.id, getQty(p.id)+stepQty(p)); render(); });
    root.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => { const p=productById(b.dataset.dec); setQty(p.id, getQty(p.id)-stepQty(p)); render(); });
    root.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => { removeFromCart(b.dataset.remove); render(); });
    const pay = root.querySelector("#payBtn");
    if (pay) pay.onclick = () => { const n = root.querySelector("#payNote"); if (n) n.textContent = t('cart.pay_soon'); };
  }

  window.onLangApplied = render;
  render();
</script>
</body>
</html>
