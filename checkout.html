<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kassa – Qoods bageri</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#8A5A38">
<script>try{var th=localStorage.getItem('qoods_theme')||'light';document.documentElement.setAttribute('data-theme',th);var lg=localStorage.getItem('qoods_lang')||'sv';document.documentElement.lang=lg;document.documentElement.dir=lg==='ar'?'rtl':'ltr';}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Mulish:wght@400;500;600;700&family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  .checkout{padding:48px 0 90px}
  .checkout h1{font-family:var(--serif);font-weight:500;font-size:clamp(2rem,4vw,2.7rem);color:var(--ink);margin-bottom:30px}
  .co-section{margin-top:30px}
  .co-h{font-family:var(--serif);font-weight:500;font-size:1.3rem;color:var(--ink);margin-bottom:16px}
  .opt-list{display:flex;flex-direction:column;gap:12px}
  .opt{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:14px;padding:15px 18px;cursor:pointer;background:var(--card);transition:.15s}
  .opt:hover{border-color:var(--brown)}
  .opt.sel{border-color:var(--brown);box-shadow:0 0 0 2px rgba(138,90,56,.14)}
  .opt input{width:18px;height:18px;accent-color:var(--brown);flex:0 0 auto;margin:0}
  .opt .otext{display:flex;flex-direction:column;gap:2px}
  .opt .ot{font-family:var(--serif);color:var(--ink);font-size:1.05rem}
  .opt .od{font-size:.86rem;color:var(--body)}
  .opt .oprice{margin-inline-start:auto;font-family:var(--serif);color:var(--brown);white-space:nowrap;font-size:1rem}
  #addrBox{margin-top:14px}
  .co-line{display:flex;justify-content:space-between;gap:16px;padding:9px 0;font-size:.98rem}
  .co-line .n{color:var(--body)} .co-line .v{font-family:var(--serif);color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
  .co-items{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0;margin:8px 0 6px}
  .co-total{display:flex;justify-content:space-between;padding-top:12px;margin-top:6px;border-top:2px solid var(--line);font-family:var(--serif);font-size:1.3rem;color:var(--ink)}
  .co-vat{display:flex;justify-content:space-between;padding-top:6px;font-size:.86rem;color:#9a8b76}
  :root[data-theme="dark"] .co-vat{color:#a99a86}
  .co-err{color:#b06a52;font-weight:600;font-size:.92rem;margin-top:16px;min-height:1.2em}
  .co-paynote{color:var(--body);font-size:.95rem;line-height:1.7;margin-bottom:14px}
  .co-channels{display:flex;gap:12px;flex-wrap:wrap}
  .co-channels a{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:12px 18px;color:var(--ink);font-weight:600;background:var(--card);text-decoration:none;transition:.15s}
  .co-channels a:hover{border-color:var(--brown);color:var(--brown)}
  .co-shipnote{margin-top:14px;padding:12px 15px;background:var(--cream-top);border:1px solid var(--line);border-radius:12px;color:var(--body);font-size:.9rem;line-height:1.6}
  :root[data-theme="dark"] .co-shipnote{background:rgba(255,255,255,.04)}
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="index.html" class="logo"><b>Qoods</b> <span>bageri</span></a>
    <div class="nav-right">
      <div class="lang-switch">
        <button data-lang="sv" onclick="setLang('sv')">SV</button>
        <button data-lang="en" onclick="setLang('en')">EN</button>
        <button data-lang="ar" onclick="setLang('ar')">ع</button>
      </div>
      <button class="theme-toggle" data-theme-toggle onclick="toggleTheme()" aria-label="Theme">☾</button>
      <a href="cart.html" class="cart-link"><span data-i18n="nav.cart">Kundvagn</span> <span class="cart-badge" data-cart-count>0</span></a>
    </div>
  </div>
</header>

<section class="checkout">
  <div class="wrap">
    <div class="eyebrow" data-i18n="co.title">Kassa</div>
    <h1 data-i18n="co.title">Kassa</h1>
    <div id="coRoot"></div>
  </div>
</section>

<footer>
  <div class="wrap"><div class="foot-bottom" data-i18n="foot.rights">© 2026 Qoods Bageri. Alla rättigheter förbehållna.</div></div>
</footer>

<script src="i18n.js"></script>
<script src="data.js"></script>
<script>
  const root = document.getElementById("coRoot");
  // Orders are emailed to the shop inbox via the Google Apps Script engine (no online payment).
  const ORDER_ENDPOINT = "https://script.google.com/macros/s/AKfycbyaX1scCbF4Dig7rfl11uTkEolnfDkJdi3D6M7omLjwk74sqo_WmcFFSt4JvXE0aiMM4g/exec";
  const fmt = n => (Math.round(n * 100) / 100).toLocaleString("sv-SE");
  const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
  function nextOrderNo(){ let n = (parseInt(localStorage.getItem("qoods_order_no") || "1000", 10) || 1000) + 1; localStorage.setItem("qoods_order_no", n); return n; }

  function render(){
    const cart = getCart();
    document.querySelector('.checkout h1').textContent = t('co.title');
    if (!cart.length){
      root.innerHTML = `<div class="cart-empty"><p>${t('co.empty')}</p><a class="btn btn-primary" href="index.html#menu">${t('cart.browse')}</a></div>`;
      return;
    }

    let subtotal = 0;
    const itemRows = cart.map(it => {
      const p = productById(it.id); if(!p) return "";
      const lt = lineTotal(p, it.qty); subtotal += lt;
      const q = p.type === "kg" ? `${fmt(it.qty)} kg` : `${it.qty} ×`;
      return `<div class="co-line"><span class="n">${q} ${pName(p.id)}</span><span class="v">${fmt(lt)} kr</span></div>`;
    }).join("");

    root.innerHTML = `
      <div class="cart-layout">
        <div class="form-card">
          <div class="co-section" style="margin-top:0">
            <div class="co-h">${t('co.your_details')}</div>
            <div class="form-grid">
              <div class="field"><label>${t('form.name')}</label><input id="coName" type="text" placeholder="${t('form.name_ph')}"></div>
              <div class="field"><label>${t('form.phone')}</label><input id="coPhone" type="tel" placeholder="${t('form.phone_ph')}"></div>
              <div class="field full"><label>${t('form.email')}</label><input id="coEmail" type="email" placeholder="${t('form.email_ph')}"></div>
            </div>
          </div>

          <div class="co-section">
            <div class="co-h">${t('co.method')}</div>
            <div class="opt-list">
              <label class="opt sel" data-method="pickup">
                <input type="radio" name="delivery" value="pickup" checked>
                <span class="otext"><span class="ot">${t('co.pickup_opt')}</span><span class="od">${t('co.pickup_opt_desc')}</span></span>
                <span class="oprice">${t('co.free')}</span>
              </label>
              <label class="opt" data-method="post">
                <input type="radio" name="delivery" value="post">
                <span class="otext"><span class="ot">${t('co.post_opt')}</span><span class="od">${t('co.post_opt_desc')}</span></span>
                <span class="oprice">${t('co.ship_calc')}</span>
              </label>
            </div>
            <p class="co-shipnote" id="shipNote" hidden>${t('co.ship_note')}</p>
            <div id="addrBox" hidden>
              <div class="form-grid">
                <div class="field full"><label>${t('co.street')}</label><input id="coStreet" type="text"></div>
                <div class="field"><label>${t('co.postcode')}</label><input id="coZip" type="text"></div>
                <div class="field"><label>${t('co.city')}</label><input id="coCity" type="text"></div>
              </div>
            </div>
          </div>

          <div class="co-section">
            <div class="co-h">${t('order.title')}</div>
            <p class="co-paynote">${t('co.payment_info')}</p>
            <div class="co-channels">
              <a href="tel:+46720207210">📞 ${t('order.call')}</a>
              <a href="https://wa.me/46720207210" target="_blank" rel="noopener">💬 ${t('order.whatsapp')}</a>
            </div>
          </div>

          <div class="co-err" id="coErr"></div>
        </div>

        <div class="summary">
          <h3>${t('co.summary')}</h3>
          <div class="co-items">${itemRows}</div>
          <div class="co-line"><span class="n">${t('cart.subtotal')}</span><span class="v">${fmt(subtotal)} kr</span></div>
          <div class="co-line"><span class="n">${t('ty.shipping')}</span><span class="v" id="shipVal"></span></div>
          <div class="co-total"><span>${t('ty.total')}</span><span id="totalVal"></span></div>
          <div class="co-vat"><span>${t('ty.vat')}</span><span>${fmt(subtotal * 6 / 106)} kr</span></div>
          <button class="btn btn-primary" id="placeBtn" style="width:100%;margin-top:22px">${t('co.place_order')}</button>
          <div class="fineprint">${t('cart.fineprint')}</div>
        </div>
      </div>`;

    const method = () => document.querySelector('input[name="delivery"]:checked').value;
    function update(){
      const isPost = method() === "post";
      document.getElementById("shipVal").textContent = isPost ? t('co.ship_tbd') : t('co.free');
      document.getElementById("totalVal").textContent = isPost ? (fmt(subtotal) + " kr " + t('co.plus_ship')) : (fmt(subtotal) + " kr");
      document.getElementById("addrBox").hidden = !isPost;
      document.getElementById("shipNote").hidden = !isPost;
      document.querySelectorAll('.opt[data-method]').forEach(o => o.classList.toggle("sel", o.dataset.method === method()));
    }
    document.querySelectorAll('input[name="delivery"]').forEach(r => r.onchange = update);
    update();

    document.getElementById("placeBtn").onclick = () => {
      const name = document.getElementById("coName").value.trim();
      const email = document.getElementById("coEmail").value.trim();
      const phone = document.getElementById("coPhone").value.trim();
      const err = document.getElementById("coErr");
      if (!name || !email || !phone){ err.textContent = t('co.required'); return; }
      if (!emailOk(email)){ err.textContent = t('co.invalid_email'); return; }
      const m = method();
      let address = "";
      if (m === "post"){
        const street = document.getElementById("coStreet").value.trim();
        const zip = document.getElementById("coZip").value.trim();
        const city = document.getElementById("coCity").value.trim();
        if (!street || !zip || !city){ err.textContent = t('co.address_required'); return; }
        address = `${street}, ${zip} ${city}`;
      }
      const isPost = m === "post";
      const orderNo = nextOrderNo();

      // Build a readable order summary and send it to the shop inbox (email only, no payment).
      const lines = cart.map(it => {
        const p = productById(it.id); if (!p) return "";
        const lt = lineTotal(p, it.qty);
        const q = p.type === "kg" ? `${fmt(it.qty)} kg` : `${it.qty}×`;
        return `• ${q} ${pName(p.id)} — ${fmt(lt)} kr`;
      }).filter(Boolean).join("\n");
      const delivery = isPost ? "Post" : "Upphämtning i butik";
      const shipLine = isPost ? "\nFrakt: beräknas efter adress och storlek — meddela kunden" : "";
      const totalLine = isPost
        ? `TOTALT (varor): ${fmt(subtotal)} kr + frakt`
        : `TOTALT: ${fmt(subtotal)} kr`;
      const message =
`🛒 NY BESTÄLLNING (via webben) #${orderNo}

${lines}

Delsumma: ${fmt(subtotal)} kr
Leverans: ${delivery}${address ? "\nAdress: " + address : ""}${shipLine}
${totalLine}

Betalning: EJ gjord — kontakta kunden för att bekräfta leverans/frakt och komma överens om betalning.`;

      const btn = document.getElementById("placeBtn");
      btn.disabled = true; btn.textContent = t('form.sending');
      err.textContent = "";

      sessionStorage.setItem("qoods_last_order", JSON.stringify(cart));
      sessionStorage.setItem("qoods_order_customer", JSON.stringify({ name, email, phone, method: m, address, orderNo }));

      fetch(ORDER_ENDPOINT, {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ type: "question", name, email, phone, message })
      }).finally(() => {
        let url = "thankyou.html?order=" + orderNo + "&method=" + m;
        if (address) url += "&address=" + encodeURIComponent(address);
        location.href = url;
      });
    };
  }

  window.onLangApplied = render;
  render();
</script>
</body>
</html>
